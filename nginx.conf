server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Está atrás do Traefik (TLS termina nele): qualquer redirect sai relativo,
    # para não virar http:// e não perder o https.
    absolute_redirect off;

    # Cabeçalhos de segurança. Ficam no server para herdarem em todas as rotas;
    # por isso os locations usam "expires" em vez de "add_header" de cache.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Canônico é sem www: qualquer acesso por www vai para o domínio raiz.
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    # JS e CSS com hash do Vite: cache de um ano
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # Imagens responsivas e mídia do site
    location ^~ /images/ {
        try_files $uri =404;
        expires 30d;
    }

    # Mirror dos assets de mídia (fotos e vídeos)
    location ^~ /__l5e/ {
        try_files $uri =404;
        expires 30d;
    }

    # Service worker e manifesto: sem cache para acompanhar deploys
    location = /sw.js {
        try_files $uri =404;
        expires -1;
    }

    location = /manifest.json {
        try_files $uri =404;
        expires -1;
    }

    # Arquivos de descoberta (ARD, security.txt, etc.): se não existir, 404.
    # Sem isso o fallback da SPA devolve index.html como se fosse o arquivo.
    location ^~ /.well-known/ {
        try_files $uri =404;
        expires 1h;
    }

    # Páginas pré-renderizadas (/privacy, /services/x, /portfolio/x) e fallback da SPA.
    # A ordem importa: procura o index.html da rota ANTES do caminho puro, senão o
    # nginx responde 301 para a barra final e o canonical (sem barra) deixa de bater.
    location / {
        expires -1;
        try_files $uri/index.html $uri /index.html;
    }

    error_page 404 /index.html;
}
