server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # JS e CSS com hash do Vite: cache longo
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Imagens responsivas, midia do site e mirror de assets
    location ^~ /images/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ^~ /__l5e/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Service worker e manifesto: sem cache para acompanhar deploys
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Páginas pré-renderizadas (/privacy, /services/x, /portfolio/x) e fallback da SPA
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    error_page 404 /index.html;
}
