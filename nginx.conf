server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Está atrás do Traefik (TLS termina nele): qualquer redirect sai relativo,
    # para não virar http:// e não perder o https.
    absolute_redirect off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Canônico é sem www: qualquer acesso por www vai para o domínio raiz.
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # JS e CSS com hash do Vite: cache longo
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Imagens responsivas, midia do site e mirror de assets
    location ^~ /images/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ^~ /__l5e/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Service worker e manifesto: sem cache para acompanhar deploys
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Páginas pré-renderizadas (/privacy, /services/x, /portfolio/x) e fallback da SPA.
    # A ordem importa: procura o index.html da rota ANTES do caminho puro, senão o
    # nginx responde 301 para a barra final e o canonical (sem barra) deixa de bater.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri/index.html $uri /index.html;
    }

    error_page 404 /index.html;
}
